version: "3"

services:
  api:
    build: .
    container_name: lab_clima_api
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    ports:
      - "5000:5000"
    env_file:
      - .env
